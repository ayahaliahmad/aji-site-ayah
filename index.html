      --rule: #e2e2e2;
      --accent: #1f4e79;
      --placeholder-bg: #fff8e1;
      --placeholder-border: #e0b84c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 56px 16px 72px;

      font-size: 18px;
      line-height: 1.6;

      font-size: 2.6rem;

    section {
      padding: 32px 0;
      border-bottom: 1px solid var(--rule);
    }
    h2 {
      margin: 0 0 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .placeholder {
      margin: 0;
      padding: 14px 16px;
      background: var(--placeholder-bg);
      border: 1px dashed var(--placeholder-border);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 0.95rem;
      color: #6b5200;
    }
    a {
      color: var(--accent);
      text-underline-offset: 3px;
    }
    .contact p { margin: 0; }
    footer {
      padding-top: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
